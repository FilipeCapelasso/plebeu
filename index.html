<style>
:root{--r:#c80000;--r2:#a00000;--g:#25ae88;--bg:#fff;--cd:#f8f8f8;--bd:#e6e6e6;--tx:#2b2b33;--mu:#8b8b96}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--tx);background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding:0 18px 90px}
.cover{height:110px;background:linear-gradient(135deg,#c80000,#e8452f 60%,#7a0000)}
.prof{display:flex;justify-content:space-between;align-items:flex-end;margin-top:-52px}
.ava{width:104px;height:104px;border-radius:50%;border:4px solid #fff;object-fit:cover;background:#ddd;display:grid;place-items:center;font-size:40px;font-weight:800;color:#fff;background:var(--r)}
.ava.s{width:56px;height:56px;border-width:2px;font-size:20px}
.logo{height:76px;max-width:130px;object-fit:contain;background:#fff;border-radius:8px;padding:4px}
h1{margin:14px 0 2px;font-size:26px;font-weight:800}h2{font-size:22px;font-weight:800;margin:26px 0 12px}h3{margin:0;font-size:18px;font-weight:800}
.mu,small{color:var(--mu)}.row{display:flex;gap:10px;margin:14px 0}
.btn{display:block;width:100%;padding:15px;border-radius:999px;border:1px solid var(--bd);background:var(--cd);font:600 15px Inter,sans-serif;color:var(--tx);text-align:center;text-decoration:none;cursor:pointer;margin-top:10px}
.btn.red{background:var(--r);color:#fff;border-color:var(--r)}.btn.red:hover{background:var(--r2)}
.btn.wa{background:var(--g);color:#fff;border-color:var(--g)}.btn.or{background:#c96d22;color:#fff;border-color:#c96d22}
.row .btn{width:auto;margin:0;padding:13px 22px}
.card{border:1px solid var(--bd);border-radius:22px;padding:18px;margin-bottom:16px}
.card img{width:100%;height:200px;object-fit:contain;margin:8px 0 12px}
.foot{text-align:center;font-size:12px;margin-top:30px}.foot a{color:var(--mu)}
.bubble{position:fixed;right:14px;bottom:16px;background:var(--g);color:#fff;border-radius:999px;padding:8px 18px 8px 8px;display:flex;gap:10px;align-items:center;font-weight:600;text-decoration:none;box-shadow:0 6px 20px #0003;z-index:5}
.bubble .ava{width:44px;height:44px;border-width:2px;font-size:16px}
#modal{position:fixed;inset:0;background:#0007;display:none;z-index:10;overflow:auto}
.sheet{background:#fff;max-width:560px;min-height:100%;margin:0 auto;padding:16px 18px 40px}
.mh,.mt{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mh{padding-bottom:12px;border-bottom:1px solid var(--bd)}.mt{padding:6px 0;border-bottom:1px solid var(--bd);margin-bottom:12px}
.mt h2{margin:10px 0;font-size:21px}.mt b{font-size:26px;color:var(--r);padding:0 7px;cursor:pointer}.mt b:last-child{color:var(--mu)}
.mp{display:flex;gap:10px;align-items:center}.wab{background:var(--g);color:#fff;border-radius:999px;padding:12px 18px;text-decoration:none;font-weight:700}
.gal #gm{width:100%;height:260px;object-fit:contain}.th{display:flex;gap:8px;overflow:auto;padding:6px 0}
.th img{width:70px;height:54px;object-fit:contain;border:2px solid var(--bd);border-radius:8px;cursor:pointer}
.vid{width:100%;aspect-ratio:16/9;border:0;border-radius:14px;background:#000;margin-top:8px}
.desc{white-space:pre-wrap;line-height:1.6;margin-top:18px}
.pl label{display:block;padding:9px 0;font-size:18px;cursor:pointer}.pl input{accent-color:var(--r);margin-right:10px;transform:scale(1.4)}
input,select,textarea{width:100%;padding:15px;border:1px solid var(--bd);border-radius:12px;font:16px Inter,sans-serif;margin-top:10px;background:#fff}
textarea{min-height:150px}label.l{display:block;font-size:13px;color:var(--mu);margin-top:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 20px;border-radius:999px;z-index:30;display:none}
.card{position:relative}.row .btn{flex:1;padding:13px 12px}
.chips{display:flex;gap:8px;overflow:auto;padding:12px 0 6px}.chip{flex:none;padding:9px 16px;border-radius:999px;border:1px solid var(--bd);background:#fff;font:600 14px Inter,sans-serif;cursor:pointer}.chip.on{background:var(--r);color:#fff;border-color:var(--r)}
.selo{position:absolute;top:14px;right:14px;background:var(--r);color:#fff;font:700 12px Inter,sans-serif;padding:5px 11px;border-radius:999px}
.par{margin:2px 0 8px;font-size:14px}.par b{color:var(--r);font-size:18px}
.lb{position:fixed;inset:0;background:#000e;z-index:20;display:grid;place-items:center}.lb img{max-width:96vw;max-height:90vh}
.sk{height:260px;border-radius:22px;background:linear-gradient(90deg,#f0f0f0,#fafafa,#f0f0f0);margin-bottom:16px}
.stk{position:sticky;bottom:0;background:#fff;padding:10px 0 4px;margin-top:14px}#modal{overscroll-behavior:contain}
details{border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:12px 0;font-size:14px;line-height:1.5}summary{font-weight:700;cursor:pointer}
@media(min-width:720px){#modal{padding:28px 14px}.sheet{max-width:780px;min-height:0;border-radius:18px;box-shadow:0 20px 60px #0005}.gal #gm{height:330px}}
.gal{display:flex;gap:10px;align-items:center}#gmain{flex:1;min-width:0}.gal .th{flex-direction:column;width:76px;flex:none;max-height:340px;padding:0}.gal .th img{width:70px}
.vb{width:46px;height:46px;border-radius:50%;background:var(--r);color:#fff;border:0;font-size:16px;cursor:pointer;flex:none;align-self:center}
@media(max-width:719px){.gal{flex-direction:column;align-items:stretch}.gal .th{flex-direction:row;width:100%;max-height:none;overflow:auto}}
.acts{display:flex;gap:8px;margin:12px 0;border-top:1px solid var(--bd);padding-top:12px}.acts .btn{margin:0;border-radius:10px;padding:14px 6px;font-size:14px;flex:1}
.ft{font-size:18px;font-weight:800;margin:18px 0 8px}.desc{white-space:normal;line-height:1.55;margin-top:0}.hl{color:var(--mu);font-weight:800;margin:6px 0}
.fin{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}.fin>div{flex:1}.fin img{width:48%;border:1px solid var(--bd);border-radius:12px;object-fit:contain}
.hw{background:var(--cd);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5;margin:10px 0}.pill{width:auto!important;margin:0!important;padding:12px 18px!important}
/* admin */
.ad{max-width:760px;margin:0 auto;padding:18px}.tabs{display:flex;gap:8px;margin:14px 0}.tabs .btn{margin:0;padding:11px}.tabs .on{background:var(--r);color:#fff}
.it{display:flex;gap:12px;align-items:center;border:1px solid var(--bd);border-radius:14px;padding:10px;margin-top:10px}
.it img{width:70px;height:54px;object-fit:contain}.it .g{flex:1}.it button,.sm{border:1px solid var(--bd);background:var(--cd);border-radius:10px;padding:8px 12px;cursor:pointer;font:600 13px Inter}
.ph{display:grid;grid-template-columns:repeat(auto-fill,90px);gap:8px;margin-top:10px}.ph div{position:relative}.ph img{width:90px;height:70px;object-fit:contain;border:1px solid var(--bd);border-radius:8px}
.ph i{position:absolute;top:-6px;right:-6px;background:var(--r);color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;font-style:normal;cursor:pointer}
.pr{display:flex;gap:8px}.pr input{margin-top:8px}

/* ===== V2: visual profissional ===== */
:root{--ink:#0d0d12;--paper:#f3f3f6;--sh:0 1px 2px #0001,0 14px 34px -16px #0003}
html{scroll-behavior:smooth}
body{background:var(--paper);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Sora,Inter,sans-serif;letter-spacing:-.02em}
:focus-visible{outline:3px solid #c8000066;outline-offset:2px}
.hero{position:relative;overflow:hidden;color:#fff;padding:28px 32px 30px;border-radius:0 0 32px 32px;background:radial-gradient(640px 240px at 90% -40%,#c8000050,transparent 70%),linear-gradient(160deg,#1b1b23,#0a0a0e 78%);box-shadow:0 22px 44px -30px #000}
.glow{position:absolute;width:280px;height:280px;left:-130px;bottom:-190px;background:#c80000;filter:blur(110px);opacity:.26;animation:breathe 7s ease-in-out infinite;pointer-events:none}
.spd{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.spd i{position:absolute;height:2px;width:36vw;left:-40vw;opacity:0;background:linear-gradient(90deg,transparent,#ff3b30,transparent);transform:skewX(-30deg);animation:dash 5.5s cubic-bezier(.4,0,.2,1) infinite}
.spd i:nth-child(1){top:24%}.spd i:nth-child(2){top:52%;animation-delay:1.8s;width:26vw}.spd i:nth-child(3){top:80%;animation-delay:3.4s}.spd i:nth-child(4){display:none}
@keyframes dash{0%{left:-40vw;opacity:0}15%{opacity:.7}60%{opacity:.4}100%{left:110vw;opacity:0}}
@keyframes breathe{50%{opacity:.4;transform:scale(1.15)}}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
.hin{position:relative;max-width:1376px;margin:0 auto;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;grid-template-areas:"a id l s" "a c l s";column-gap:22px;row-gap:14px;align-items:center}
.hin.nl{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"a id s" "a c s"}
.hin>*{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
.hero .ava{grid-area:a;width:96px;height:96px;border:3px solid #ffffff33;box-shadow:0 0 0 6px #ffffff10,0 14px 34px #0008;flex:none}
.idt{grid-area:id;min-width:0;align-self:end;animation-delay:.06s}
.hero h1{margin:0;font-size:clamp(28px,3.4vw,40px);line-height:1.05;display:flex;align-items:center;gap:10px;font-weight:800}
.vf{width:.5em;height:.5em;flex:none}
.hero p{margin:6px 0 0;color:#ffffffbd;font-size:15px;max-width:520px;line-height:1.45}
.ctas{grid-area:c;display:flex;gap:10px;align-self:start;flex-wrap:wrap;animation-delay:.12s}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 22px;border-radius:999px;font:700 14.5px Inter,sans-serif;color:#fff;text-decoration:none;background:#ffffff14;border:1px solid #ffffff30;backdrop-filter:blur(6px);transition:transform .25s,background .25s,box-shadow .25s}
.cta svg{width:18px;height:18px;flex:none}
.cta.w{background:linear-gradient(135deg,#e01a1a,#b00000);border-color:#ff5a4d66;box-shadow:0 10px 26px -10px #e0111199}
.cta:hover{transform:translateY(-2px);background:#ffffff26}.cta.w:hover{background:linear-gradient(135deg,#f02a2a,#c00000);box-shadow:0 14px 30px -10px #e01111cc}
.hlogo{grid-area:l;height:58px;max-width:150px;object-fit:contain;background:#fff;border-radius:14px;padding:7px 11px;box-shadow:0 10px 26px -12px #000a;animation-delay:.18s}
.stats{grid-area:s;display:flex;gap:10px;animation-delay:.24s}
.stats div{background:#ffffff0d;border:1px solid #ffffff1c;border-radius:16px;padding:12px 18px;min-width:150px;backdrop-filter:blur(10px)}
.stats b{display:block;font:800 clamp(21px,2.2vw,28px) Sora,sans-serif;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stats span{display:block;margin-top:3px;font-size:12px;color:#ffffff9e;line-height:1.3}
.wrap{max-width:1440px;padding:0 32px 60px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 12px}
.sec h2{margin:0;font-size:clamp(22px,2.4vw,28px)}
.nc{font:600 13px Inter,sans-serif;color:var(--mu);white-space:nowrap}
.bar{position:sticky;top:10px;z-index:6;margin:0 0 22px;display:flex;align-items:center;gap:14px;padding:10px 12px;background:#ffffffe8;backdrop-filter:blur(16px) saturate(1.4);border:1px solid #fff;border-radius:20px;box-shadow:0 14px 36px -18px #0005;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.bar.hd{transform:translateY(calc(-100% - 24px))}.bar:focus-within{transform:none}
.sb{position:relative;flex:0 1 340px}.sb svg{position:absolute;left:16px;top:50%;translate:0 -50%;width:18px;color:var(--mu)}

async function say(items){const tk=CH.tk;CH.busy=true;chBk();for(const it of items){const l=$c('chl'),t=document.createElement('div');t.className='chm chty';t.innerHTML=avH()+'<div><span></span><span></span><span></span></div>';l.appendChild(t);bot();const len=typeof it==='string'?it.length:30;await sleep(400+Math.min(len*12,800));t.remove();if(tk!==CH.tk)return false;addB(it)}CH.busy=false;chBk();return true}
function lock(b,f){$c('chi').disabled=b;$c('chf').querySelector('button').disabled=b;if(!b&&f&&innerWidth>720)$c('chi').focus()}
function chBk(){const b=$c('chbk');if(b)b.disabled=CH.busy||CH.hist.length<2||CH.step==='fim'}
function opts(o){CH.opts=o;$c('chq').innerHTML=o.map((x,i)=>`<button type="button" data-i="${i}" style="animation-delay:${Math.min(i,10)*40}ms">${esc(x)}</button>`).join('')}
async function ask(id){const s=ST[id];CH.step=id;CH.hist.push({id,ans:{...CH.ans},n:$c('chl').children.length});opts([]);lock(true);chBk();const q=s.q(CH.ans);if(await say([q])===false)return;const o=s.opts?s.opts(CH.ans):[];opts(o);const i=$c('chi');i.value='';i.placeholder=s.ph||'Digite aqui';i.inputMode=s.mode||'text';lock(false,!o.length)}
async function submit(v){v=String(v||'').trim();if(!v||CH.busy||!ST[CH.step])return;const s=ST[CH.step],r=s.run(v);
 if(r.err){addU(v);$c('chi').value='';addB({err:r.err});return}
 addU(r.show||v);$c('chi').value='';opts([]);lock(true);
 Object.assign(CH.ans,r.set||{});if(r._c)CH.ans.cand=r._c.map(m=>m.nome);
 const items=r.say?r.say(CH.ans):[];if(items.length&&await say(items)===false)return;
 const n=typeof r.next==='function'?r.next(CH.ans):r.next;n==='fim'?fim():ask(n)}
const T={financiamento:'FINANCIAMENTO',consorcio:'CONSÓRCIO',avista:'COMPRA À VISTA',cartao:'COMPRA NO CARTÃO DE CRÉDITO'};
function resumo(){const a=CH.ans,l=[];a.moto&&l.push('Moto: '+a.moto);a.pag&&l.push('Pagamento: '+T[a.pag]);a.entrada&&l.push('Entrada: '+a.entrada);a.parcela&&l.push('Parcela desejada: '+a.parcela);a.forma&&l.push('Forma: '+a.forma);a.troca&&l.push('Troca: '+a.troca);a.cartao&&l.push('Cartão: '+a.cartao);return l.join('\n')}
function msg(){const a=CH.ans,nd=a.pag==='financiamento'||a.pag==='consorcio',l=[`Olá, vim do seu site e quero as condições de ${T[a.pag]} da ${(a.moto||'moto').toUpperCase()} que vi no seu site.`,nd?'Seguem os dados para APROVACAO:':'Seguem meus dados:'];
 if(a.pag==='financiamento')l.push('Entrada: '+(a.entrada||'Sem entrada'));if(a.pag==='consorcio'&&a.parcela)l.push('Parcela desejada: '+a.parcela);if(a.pag==='avista'){l.push('Forma de pagamento: '+a.forma);l.push('Moto na troca: '+a.troca)}if(a.pag==='cartao')l.push('Parcelamento: '+a.cartao);
 if(nd){l.push('Data de nascimento: '+a.nasc);l.push('CPF: '+a.cpf)}l.push('Nome: '+(a.nomec||a.nome));l.push('Celular: +'+a.tel);if(a.hab)l.push('Habilitação: '+a.hab);l.push('IA VENDEDOR VIRTUAL');return l.join('\n')}
async function save(tipo,det){if(!sb)return;const a=CH.ans,row={tipo,moto_id:/^[0-9a-f-]{36}$/i.test(a.motoId||'')?a.motoId:null,moto_nome:a.moto||null,nome:a.nomec||a.nome||null,telefone:a.tel?'+'+a.tel:null,cpf:a.cpf||null,nascimento:a.nasc||null,entrada:a.entrada||null,habilitacao:a.hab||null,detalhes:det};
 try{const r=await sb.from('leads').insert({...row,pagamento:a.pag||null,origem:'chat'});if(r.error)await sb.from('leads').insert(row)}catch(e){}}
async function fim(){CH.step='fim';opts([]);lock(true);const a=CH.ans,m=msg(),nd=a.pag==='financiamento'||a.pag==='consorcio';CH.saved=true;save(a.pag,m);
 if(await say([nd?`Fechado, ${pn()}! Recebi seus dados para a pré-análise. O resultado final é passado pelo vendedor.`:`Fechado, ${pn()}! Já anotei tudo por aqui. O vendedor te passa os valores e as condições.`,'Clique no botão abaixo para continuar com o vendedor pelo WhatsApp.',{wa:m}])===false)return;opts(['Nova conversa']);CH.step='fim';chBk()}
function partial(){const a=CH.ans;if(CH.saved||CH.part||!a.tel)return;CH.part=true;save('chat_incompleto','Conversa não concluída\n'+resumo())}
function start(){CH.tk++;CH.ans={};CH.hist=[];CH.saved=false;CH.part=false;CH.step=null;CH.busy=false;CH.started=true;$c('chl').innerHTML='';opts([]);(async()=>{lock(true);if(await say([{html:`Bem-vindo à ${esc(EMP)}! Sou ${esc(V.nome)} e vou te ajudar a escolher sua próxima moto. Ao avançar você concorda com os nossos Termos de Uso.<br><br><a class="ln" href="https://vendedor.site/termos/lgpd" target="_blank" rel="noopener">https://vendedor.site/termos/lgpd</a>`}])===false)return;ask('nome')})()}
function build(){if($c('ch'))return;document.body.insertAdjacentHTML('beforeend',`<div class="ch" id="ch" role="dialog" aria-label="Chat com o vendedor"><div class="chh"><button class="chb" id="chbk" type="button" aria-label="Voltar uma pergunta" title="Voltar">‹</button>${avH()}<div><b>${esc(V.nome)}</b><small><i></i>Online agora</small></div><button class="chb" id="chrs" type="button" aria-label="Recomeçar" title="Recomeçar">↻</button><button class="chb" id="chx" type="button" aria-label="Fechar">✕</button></div><div class="chl" id="chl" aria-live="polite"></div><div class="chq" id="chq"></div><form class="chf" id="chf" autocomplete="off"><input id="chi" placeholder="Digite aqui" enterkeyhint="send" aria-label="Sua resposta"><button>Enviar</button></form></div>`);
 $c('chf').onsubmit=e=>{e.preventDefault();submit($c('chi').value)};
 $c('chq').onclick=e=>{const b=e.target.closest('button');if(!b)return;const v=CH.opts[+b.dataset.i];if(CH.step==='fim'){start();return}submit(v)};
 $c('chx').onclick=close;$c('chrs').onclick=()=>{partial();start()};
 $c('chbk').onclick=()=>{if(CH.busy||CH.hist.length<2||CH.step==='fim')return;CH.tk++;CH.hist.pop();const h=CH.hist.pop(),l=$c('chl');while(l.children.length>h.n)l.lastChild.remove();CH.ans={...h.ans};CH.busy=false;ask(h.id)};
 $c('chi').oninput=function(){const s=ST[CH.step],k=s&&s.mask;if(!k)return;let d=dg(this.value);if(k==='tel'){if(d.length>11&&d.startsWith('55'))d=d.slice(2);this.value=fTel(d.slice(0,11))}else if(k==='cpf')this.value=fCpf(d.slice(0,11));else this.value=fNas(d.slice(0,8))};
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$c('ch').classList.contains('on'))close()});addEventListener('pagehide',partial)}
function open(e){if(e&&e.preventDefault)e.preventDefault();build();$c('ch').classList.add('on');document.body.classList.add('chopen');if(innerWidth<=720)document.documentElement.style.overflow='hidden';if(!CH.started)start();return false}
function close(){const c=$c('ch');if(c)c.classList.remove('on');document.body.classList.remove('chopen');document.documentElement.style.overflow='';partial()}
window.chatOpen=open;window.chatClose=close;
})();

init();
</script>
</body>
